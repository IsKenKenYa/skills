# Attribution Postback Handler Configuration

# Server Configuration
server.port=8080
server.servlet.context-path=/attribution

# Timestamp Validation (milliseconds)
attribution.timestamp.threshold=300000

# Signature Verification
attribution.signature.algorithm=SHA256WithRSA/PSS
attribution.signature.public-

# Idempotency Cache
attribution.idempotency.cache.enabled=true
attribution.idempotency.cache.ttl=3600000

# Logging
logging.level.com.attribution=DEBUG
logging.file.name=logs/attribution-postback.log

# Jackson JSON Configuration
spring.jackson.serialization.indent-output=true
spring.jackson.default-property-inclusion=non_null